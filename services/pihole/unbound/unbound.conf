# Unbound looks up domains itself (root -> .com -> example.com servers)
# instead of sending all your DNS traffic to one company like Cloudflare.
# Only settings that differ from Unbound's safe defaults are listed here.

server:
    # Unbound runs inside Pi-hole's network (see unbound.container), so only
    # Pi-hole can reach it, on 127.0.0.1:5335. Never the host or the LAN.
    interface: 127.0.0.1
    port: 5335

    # Who may ask questions: only Pi-hole (localhost). Everyone else is refused.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow

    # Pi-hole can open many TCP connections at once (default: 10).
    # Too few made Unbound drop them and DNS hang for 10-15 seconds.
    incoming-num-tcp: 100
    # Close idle TCP connections after 10 seconds (milliseconds)
    tcp-idle-timeout: 10000

    # IPv6 is turned off on this machine (see setup-host.sh)
    do-ip6: no

    # Check DNSSEC signatures with the official root key
    trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"

    # Privacy: don't reveal Unbound's name or version to anyone
    hide-identity: yes
    hide-version: yes

    # Speed: renew popular domains in the cache before they expire
    prefetch: yes
    # If a lookup is slow, answer from the cache right away (answer at most
    # 1 day old, after waiting 1.8 seconds) and refresh it in the background
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Security: a public domain may never point to a private (LAN) address.
    # Blocks "DNS rebinding" attacks against devices on your network.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16

    # Container settings: log to the journal, no chroot
    # verbosity 1: log errors and problems, not every query
    verbosity: 1
    use-syslog: no
    chroot: ""
